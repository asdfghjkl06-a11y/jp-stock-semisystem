[project]
name = "jp-stock-semisystem"
version = "0.1.0"
description = "A transparent, rule-based screener for Japanese equities"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Contributors" }]
keywords = ["japan", "stocks", "screening", "j-quants"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
  "openpyxl>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
jp-stock-screen = "run_screen:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
